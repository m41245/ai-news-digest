name: Deploy

on:
  release:
    types: [published]
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        type: choice
        options:
          - production
          - staging
        default: production
      version:
        description: "Version tag to deploy"
        required: true
        type: string
      approved_by:
        description: "Approver name (required for production)"
        required: false
        type: string
      approve_production:
        description: "Confirm production deployment approval"
        required: false
        type: boolean

permissions:
  contents: read
  packages: write

env:
  PYTHON_VERSION: "3.12"

jobs:
  preflight:
    name: Preflight Checks
    runs-on: ubuntu-latest
    outputs:
      deploy_production: ${{ steps.check.outputs.deploy_production }}
      deploy_environment: ${{ steps.check.outputs.deploy_environment }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine deployment target
        id: check
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            if [ "${{ inputs.environment }}" == "production" ]; then
              if [ "${{ inputs.approve_production }}" != "true" ]; then
                echo "ERROR: Production deployment requires approve_production=true" >&2
                exit 1
              fi
              if [ -z "${{ inputs.approved_by }}" ]; then
                echo "ERROR: approved_by is required for production deployment" >&2
                exit 1
              fi
              echo "deploy_production=true" >> "$GITHUB_OUTPUT"
              echo "deploy_environment=production" >> "$GITHUB_OUTPUT"
              echo "Deploying to PRODUCTION (approved by: ${{ inputs.approved_by }})"
            else
              echo "deploy_production=false" >> "$GITHUB_OUTPUT"
              echo "deploy_environment=staging" >> "$GITHUB_OUTPUT"
              echo "Deploying to STAGING"
            fi
          else
            echo "deploy_production=false" >> "$GITHUB_OUTPUT"
            echo "deploy_environment=staging" >> "$GITHUB_OUTPUT"
            echo "Deploying via tag/release (staging)"
          fi

  build-and-push:
    name: Build and Push
    runs-on: ubuntu-latest
    needs: [preflight]
    if: always()
    outputs:
      backend-image: ${{ steps.meta.outputs.tags }}
      backend-digest: ${{ steps.push-backend.outputs.digest }}
      frontend-image: ${{ steps.meta.outputs.tags }}
      frontend-digest: ${{ steps.push-frontend.outputs.digest }}
      deployment-environment: ${{ needs.preflight.outputs.deploy_environment }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        run: |
          pip install --upgrade pip
          pip install "poetry==2.1.0"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ghcr.io/${{ github.repository }}-frontend
          tags: |
            type=ref,event=tag,suffix={{sha}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ needs.preflight.outputs.deploy_production == 'true' && github.ref == 'refs/heads/main' }}

      - name: Build and push backend Docker image
        id: push-backend
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            PYTHON_VERSION=3.12

      - name: Build and push frontend Docker image
        id: push-frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_BASE_URL=

      - name: Image digests
        run: |
          echo "Backend image digest: ${{ steps.push-backend.outputs.digest }}"
          echo "Frontend image digest: ${{ steps.push-frontend.outputs.digest }}"

      - name: Verify images
        run: |
          docker buildx imagetransform \
            --format docker \
            --output type=image,name=${{ steps.meta.outputs.tags }},push=false \
            ${{ steps.meta.outputs.tags }}

  deployment-status:
    name: Deployment Status
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: always()
    steps:
      - name: Check deployment result
        run: |
          if [ "${{ needs.build-and-push.result }}" != "success" ]; then
            echo "::error::Deployment failed for commit ${{ github.sha }}"
            echo "::warning::Rollback instructions:"
            echo "1. Identify the last known good image tag:"
            echo "   docker pull ghcr.io/${{ github.repository }}:previous-stable-tag"
            echo "2. Update your deployment to use the previous tag:"
            echo "   kubectl set image deployment/ai-news-digest-backend backend=ghcr.io/${{ github.repository }}:previous-stable-tag"
            echo "3. Verify the rollback:"
            echo "   kubectl rollout status deployment/ai-news-digest-backend"
            echo "4. Review the deployment logs for the root cause:"
            echo "   gh run view ${{ github.run_id }}"
            exit 1
          fi
          echo "Deployment artifacts built and pushed successfully."
          echo "Environment: ${{ needs.build-and-push.outputs.deployment-environment }}"
          echo "Backend: ${{ needs.build-and-push.outputs.backend-image }}"
          echo "Frontend: ${{ needs.build-and-push.outputs.frontend-image }}"