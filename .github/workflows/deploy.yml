name: Deploy

on:
  release:
    types: [published]
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        type: choice
        options:
          - production
          - staging
        default: production
      version:
        description: "Version tag to deploy"
        required: true
        type: string
      approved_by:
        description: "Approver name (required for production)"
        required: false
        type: string
      approve_production:
        description: "Confirm production deployment approval"
        required: false
        type: boolean

permissions:
  contents: read
  packages: write

env:
  PYTHON_VERSION: "3.12"

jobs:
  preflight:
    name: Preflight Checks
    runs-on: ubuntu-latest
    outputs:
      deploy_production: ${{ steps.check.outputs.deploy_production }}
      deploy_environment: ${{ steps.check.outputs.deploy_environment }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine deployment target
        id: check
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            if [ "${{ inputs.environment }}" == "production" ]; then
              if [ "${{ inputs.approve_production }}" != "true" ]; then
                echo "ERROR: Production deployment requires approve_production=true" >&2
                exit 1
              fi
              if [ -z "${{ inputs.approved_by }}" ]; then
                echo "ERROR: approved_by is required for production deployment" >&2
                exit 1
              fi
              echo "deploy_production=true" >> "$GITHUB_OUTPUT"
              echo "deploy_environment=production" >> "$GITHUB_OUTPUT"
              echo "Deploying to PRODUCTION (approved by: ${{ inputs.approved_by }})"
            else
              echo "deploy_production=false" >> "$GITHUB_OUTPUT"
              echo "deploy_environment=staging" >> "$GITHUB_OUTPUT"
              echo "Deploying to STAGING"
            fi
          else
            echo "deploy_production=false" >> "$GITHUB_OUTPUT"
            echo "deploy_environment=staging" >> "$GITHUB_OUTPUT"
            echo "Deploying via tag/release (staging)"
          fi

  build-and-push:
    name: Build and Push
    runs-on: ubuntu-latest
    needs: [preflight]
    if: always()
    outputs:
      backend-image: ${{ steps.meta-backend.outputs.tags }}
      backend-digest: ${{ steps.push-backend.outputs.digest }}
      frontend-image: ${{ steps.meta-frontend.outputs.tags }}
      frontend-digest: ${{ steps.push-frontend.outputs.digest }}
      deployment-environment: ${{ needs.preflight.outputs.deploy_environment }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        run: |
          pip install --upgrade pip
          pip install "poetry==2.1.0"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract backend metadata
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag,suffix={{sha}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Extract frontend metadata
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-frontend
          tags: |
            type=ref,event=tag,suffix={{sha}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push backend Docker image
        id: push-backend
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            PYTHON_VERSION=3.12

      - name: Build and push frontend Docker image
        id: push-frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_BASE_URL=

      - name: Image digests
        run: |
          echo "Backend image digest: ${{ steps.push-backend.outputs.digest }}"
          echo "Frontend image digest: ${{ steps.push-frontend.outputs.digest }}"

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: always() && needs.build-and-push.result == 'success' && needs.preflight.outputs.deploy_production == 'true'
    environment:
      name: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify production deployment target
        run: |
          if [ -z "${{ secrets.PROD_DEPLOY_HOST }}" ]; then
            echo "PROD_DEPLOY_HOST secret is not configured."
            echo "Production images have been built and pushed to GHCR."
            echo "Deploy manually using:"
            echo "  docker compose -f docker-compose.prod.yml --env-file .env.prod.local up -d"
            exit 0
          fi
          echo "PROD_DEPLOY_HOST is configured. Proceeding with automated deployment."

      - name: Run pre-deployment backup
        if: ${{ secrets.PROD_DEPLOY_HOST != '' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_DEPLOY_HOST }}
          username: ${{ secrets.PROD_DEPLOY_USERNAME }}
          key: ${{ secrets.PROD_DEPLOY_SSH_KEY }}
          port: ${{ secrets.PROD_DEPLOY_PORT || 22 }}
          script: |
            set -e
            echo "Creating pre-deployment database backup..."
            cd /opt/ai-news-digest
            bash scripts/backup_db.sh
            echo "Backup completed."

      - name: Deploy to production host
        if: ${{ secrets.PROD_DEPLOY_HOST != '' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_DEPLOY_HOST }}
          username: ${{ secrets.PROD_DEPLOY_USERNAME }}
          key: ${{ secrets.PROD_DEPLOY_SSH_KEY }}
          port: ${{ secrets.PROD_DEPLOY_PORT || 22 }}
          envs: |
            GHCR_TOKEN=${{ secrets.GITHUB_TOKEN }}
          script: |
            set -euo pipefail
            IMAGE_TAG="${{ github.ref_name }}"
            echo "Deploying production image: $IMAGE_TAG"
            cd /opt/ai-news-digest

            # Use the exact image digests produced by the build job.
            # Digests are immutable and uniquely identify the built image,
            # preventing a silent fallback to the Compose 'latest' default.
            DOCKER_IMAGE="ghcr.io/${{ github.repository }}@${{ needs.build-and-push.outputs.backend-digest }}"
            FRONTEND_IMAGE="ghcr.io/${{ github.repository }}-frontend@${{ needs.build-and-push.outputs.frontend-digest }}"

            # Fail fast if the build job did not produce image digests.
            if [ -z "${{ needs.build-and-push.outputs.backend-digest }}" ] || [ -z "${{ needs.build-and-push.outputs.frontend-digest }}" ]; then
              echo "ERROR: Required image digests are missing from build job outputs."
              echo "  DOCKER_IMAGE: $DOCKER_IMAGE"
              echo "  FRONTEND_IMAGE: $FRONTEND_IMAGE"
              echo "Refusing to deploy: would fall back to 'latest'."
              exit 1
            fi

            export DOCKER_IMAGE
            export FRONTEND_IMAGE

            # Authenticate to GHCR on the remote host.
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            echo "Pulling backend image: $DOCKER_IMAGE"
            docker pull "$DOCKER_IMAGE"
            echo "Pulling frontend image: $FRONTEND_IMAGE"
            docker pull "$FRONTEND_IMAGE"

            docker compose -f docker-compose.prod.yml --env-file .env.prod.local up -d --force-recreate
            echo "Waiting for health checks..."
            sleep 30
            curl -f http://localhost:8000/health/live
            curl -f http://localhost:8000/health/ready
            echo "Production deployment completed successfully."

      - name: Rollback on failure
        if: ${{ failure() && secrets.PROD_DEPLOY_HOST != '' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_DEPLOY_HOST }}
          username: ${{ secrets.PROD_DEPLOY_USERNAME }}
          key: ${{ secrets.PROD_DEPLOY_SSH_KEY }}
          port: ${{ secrets.PROD_DEPLOY_PORT || 22 }}
          envs: |
            GHCR_TOKEN=${{ secrets.GITHUB_TOKEN }}
          script: |
            set -euo pipefail
            echo "Deployment failed. Initiating rollback..."
            cd /opt/ai-news-digest
            ROLLBACK_TAG="${{ needs.preflight.outputs.deploy_environment == 'production' && 'v1.0.0' || 'staging-latest' }}"
            DOCKER_IMAGE="ghcr.io/${{ github.repository }}:$ROLLBACK_TAG"
            FRONTEND_IMAGE="ghcr.io/${{ github.repository }}-frontend:$ROLLBACK_TAG"
            export DOCKER_IMAGE
            export FRONTEND_IMAGE
            echo "Rolling back to: backend=$DOCKER_IMAGE frontend=$FRONTEND_IMAGE"

            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker pull "$DOCKER_IMAGE"
            docker pull "$FRONTEND_IMAGE"

            docker compose -f docker-compose.prod.yml --env-file .env.prod.local up -d --force-recreate
            echo "Rollback completed. Verify health manually."

  deployment-status:
    name: Deployment Status
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy]
    if: always()
    steps:
      - name: Check deployment result
        run: |
          if [ "${{ needs.build-and-push.result }}" != "success" ]; then
            echo "::error::Deployment failed for commit ${{ github.sha }}"
            echo "::warning::Rollback instructions:"
            echo "1. Identify the last known good image tag:"
            echo "   docker pull ghcr.io/${{ github.repository }}:previous-stable-tag"
            echo "2. Update your deployment to use the previous tag:"
            echo "   kubectl set image deployment/ai-news-digest-backend backend=ghcr.io/${{ github.repository }}:previous-stable-tag"
            echo "3. Verify the rollback:"
            echo "   kubectl rollout status deployment/ai-news-digest-backend"
            echo "4. Review the deployment logs for the root cause:"
            echo "   gh run view ${{ github.run_id }}"
            exit 1
          fi
          echo "Deployment artifacts built and pushed successfully."
          echo "Environment: ${{ needs.build-and-push.outputs.deployment-environment }}"
          echo "Backend: ${{ needs.build-and-push.outputs.backend-image }}"
          echo "Frontend: ${{ needs.build-and-push.outputs.frontend-image }}"
          echo "Deploy job result: ${{ needs.deploy.result }}"