name: Scheduled Tasks (Manual / On-Demand)

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Task to run"
        required: true
        type: choice
        options:
          - ingest
          - summarize
          - categorize
          - analyze
          - cluster
          - timeline
          - ranking
          - conflict
          - story-activity
          - trend
          - evaluation
          - quality-gates
          - digest
          - deliver
          - notifications-schedule
          - notifications-scheduled
          - notifications-immediate
          - notifications-retry
          - notifications-recover
          - notifications-cleanup-deliveries
          - notifications-cleanup
          - cleanup-articles
          - cleanup-digests
  schedule:
    # Production schedule in UTC.
    # Intended local time depends on DIGEST_TIMEZONE (default: UTC).
    # These triggers are prepared but disabled by default.
    # Activate by setting repository variable ENABLE_PRODUCTION_SCHEDULE=true.
    - cron: "0 6 * * *"    # daily-rss-ingestion
    - cron: "30 6 * * *"   # daily-article-summarization
    - cron: "0 7 * * *"    # daily-article-categorization
    - cron: "30 7 * * *"   # daily-article-analysis
    - cron: "0 8 * * *"    # daily-story-clustering
    - cron: "5 8 * * *"    # daily-story-ranking
    - cron: "7 8 * * *"    # daily-story-timeline-generation
    - cron: "10 8 * * *"   # daily-story-activity-detection
    - cron: "12 8 * * *"   # daily-trend-detection
    - cron: "15 8 * * *"   # daily-digest-generation
    - cron: "30 8 * * *"   # daily-email-delivery
    - cron: "0 9 * * *"    # daily-conflict-detection
    - cron: "0 2 * * *"    # notification-cleanup-notifications
    - cron: "0 3 * * *"    # notification-cleanup-deliveries
    - cron: "0 3 * * *"    # daily-intelligence-evaluation
    - cron: "0 4 * * *"    # daily-quality-gate-evaluation

permissions:
  contents: read

jobs:
  scheduled-task:
    name: Run Scheduled Task
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: production-scheduler
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "poetry"

      - name: Install Poetry
        run: |
          pip install --upgrade pip
          pip install "poetry==2.1.0"

      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi

      - name: Run scheduled task
        env:
          DATABASE_URL: ${{ secrets.FREE_DATABASE_URL }}
          REDIS_URL: ${{ secrets.FREE_REDIS_URL }}
          CELERY_BROKER_URL: ${{ secrets.FREE_CELERY_BROKER_URL }}
          CELERY_RESULT_BACKEND: ${{ secrets.FREE_CELERY_RESULT_BACKEND }}
          JWT_SECRET_KEY: ${{ secrets.FREE_JWT_SECRET_KEY }}
          ENVIRONMENT: production
          DEBUG: "false"
          AI_ENABLED: "false"
          EMAIL_ENABLED: "false"
          EMAIL_DEVELOPMENT_MODE: "false"
          EMAIL_PROVIDER: console
          LOG_LEVEL: INFO
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ vars.ENABLE_PRODUCTION_SCHEDULE }}" != "true" ]; then
              echo "Production schedule is disabled."
              echo "Set repository variable ENABLE_PRODUCTION_SCHEDULE=true to activate."
              exit 0
            fi
            echo "Running morning pipeline (scheduled)"
            poetry run python scripts/scheduled/run_task.py ingest
            poetry run python scripts/scheduled/run_task.py summarize
            poetry run python scripts/scheduled/run_task.py categorize
            poetry run python scripts/scheduled/run_task.py analyze
            poetry run python scripts/scheduled/run_task.py cluster
            poetry run python scripts/scheduled/run_task.py ranking
            poetry run python scripts/scheduled/run_task.py timeline
            poetry run python scripts/scheduled/run_task.py story-activity
            poetry run python scripts/scheduled/run_task.py trend
            poetry run python scripts/scheduled/run_task.py digest
            poetry run python scripts/scheduled/run_task.py deliver
            poetry run python scripts/scheduled/run_task.py conflict
            poetry run python scripts/scheduled/run_task.py evaluation
            poetry run python scripts/scheduled/run_task.py quality-gates
            poetry run python scripts/scheduled/run_task.py cleanup-articles
            poetry run python scripts/scheduled/run_task.py cleanup-digests
            poetry run python scripts/scheduled/run_task.py notifications-cleanup-deliveries
            poetry run python scripts/scheduled/run_task.py notifications-cleanup
          else
            TASK="${{ github.event.inputs.task || 'ingest' }}"
            echo "Running task: $TASK"
            poetry run python scripts/scheduled/run_task.py "$TASK"
          fi
