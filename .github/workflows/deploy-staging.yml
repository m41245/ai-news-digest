name: Deploy Staging

on:
  push:
    branches: [main, master, develop]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  PYTHON_VERSION: "3.12"

jobs:
  preflight:
    name: Staging Preflight
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify staging deployment
        run: |
          echo "Staging deployment from branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"

  build-and-push:
    name: Build and Push Staging
    runs-on: ubuntu-latest
    needs: [preflight]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        run: |
          pip install --upgrade pip
          pip install "poetry==2.1.0"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ghcr.io/${{ github.repository }}-frontend
          tags: |
            type=ref,event=sha,suffix=staging
            type=raw,value=staging-latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}

      - name: Build and push backend Docker image
        id: push-backend
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            PYTHON_VERSION=3.12

      - name: Build and push frontend Docker image
        id: push-frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_BASE_URL=

      - name: Image digests
        run: |
          echo "Backend image digest: ${{ steps.push-backend.outputs.digest }}"
          echo "Frontend image digest: ${{ steps.push-frontend.outputs.digest }}"

  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: always() && needs.build-and-push.result == 'success'
    environment:
      name: staging
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify staging deployment target
        run: |
          if [ -z "${{ secrets.STAGING_DEPLOY_HOST }}" ]; then
            echo "STAGING_DEPLOY_HOST secret is not configured."
            echo "Staging images have been built and pushed to GHCR."
            echo "Deploy manually using:"
            echo "  docker compose -f docker-compose.prod.yml --env-file .env.prod.local up -d"
            exit 0
          fi
          echo "STAGING_DEPLOY_HOST is configured. Proceeding with automated deployment."

      - name: Deploy to staging host
        if: ${{ secrets.STAGING_DEPLOY_HOST != '' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_DEPLOY_HOST }}
          username: ${{ secrets.STAGING_DEPLOY_USERNAME }}
          key: ${{ secrets.STAGING_DEPLOY_SSH_KEY }}
          port: ${{ secrets.STAGING_DEPLOY_PORT || 22 }}
          script: |
            set -e
            IMAGE_TAG="${{ github.sha }}-staging"
            echo "Deploying staging image: $IMAGE_TAG"
            cd /opt/ai-news-digest
            export IMAGE_TAG="$IMAGE_TAG"
            docker compose -f docker-compose.prod.yml --env-file .env.prod.local up -d --force-recreate
            echo "Waiting for health checks..."
            sleep 30
            curl -f http://localhost:8000/health/live
            curl -f http://localhost:8000/health/ready
            echo "Staging deployment completed successfully."

  deployment-status:
    name: Staging Deployment Status
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy]
    if: always()
    steps:
      - name: Check deployment result
        run: |
          if [ "${{ needs.build-and-push.result }}" != "success" ]; then
            echo "::error::Staging deployment failed for commit ${{ github.sha }}"
            exit 1
          fi
          echo "Staging images built and pushed successfully."
          echo "Backend: ${{ needs.build-and-push.outputs.backend-image }}"
          echo "Frontend: ${{ needs.build-and-push.outputs.frontend-image }}"
          echo "Deploy job result: ${{ needs.deploy.result }}"
