[tool.poetry]
name = "ai-news-digest"
version = "0.1.0"
description = "Production-ready AI news aggregation, summarization, and daily digest platform"
authors = ["Madhav"]
readme = "README.md"
license = "MIT"
package-mode = true
packages = [{ include = "ai_news_digest", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.12,<4.0"

fastapi = ">=0.125.0,<1.0.0"
starlette = ">=1.3.1"
uvicorn = { version = "^0.32.0", extras = ["standard"] }

pydantic-settings = "^2.6.0"

sqlalchemy = { version = "^2.0.36", extras = ["asyncio"] }
alembic = "^1.14.0"
asyncpg = ">=0.29.0"

celery = { version = "^5.4.0", extras = ["redis"] }
redis = "^5.2.0"

httpx = "^0.28.0"
feedparser = "^6.0.11"

openai = "^1.57.0"
anthropic = "^0.40.0"

structlog = "^24.4.0"

sentry-sdk = "^2.0.0"

 jinja2 = "^3.1.4"
 reportlab = "^4.2.0"


tenacity = "^9.0.0"

python-multipart = ">=0.0.22,<0.1.0"
aiosqlite = "^0.22.1"
defusedxml = "^0.7.1"
aiosmtplib = "^5.1.2"
bcrypt = "^4.0.0"
PyJWT = "^2.9.0"
pydantic = { version = "^2.9.0", extras = ["email"] }

[tool.poetry.group.dev.dependencies]
ruff = "^0.8.0"
mypy = "^1.13.0"

pytest = "^9.0.3"
pytest-asyncio = "^1.0.0"
pytest-cov = "^6.0.0"

testcontainers = { version = "^4.9.0", extras = ["postgres", "redis"] }
freezegun = "^1.4.0"

pip-audit = "^2.7.3"

pre-commit = "^4.0.0"
types-defusedxml = "^0.7.0.20260504"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
fix = false

[tool.ruff.lint]
select = [
    "A",
    "ASYNC",
    "B",
    "C4",
    "E",
    "F",
    "I",
    "N",
    "PTH",
    "RUF",
    "S",
    "SIM",
    "UP",
    "W",
]

ignore = [
    "B008",
]

[tool.ruff.lint.isort]
known-first-party = ["ai_news_digest"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S104"]
"migrations/versions/*.py" = ["E501", "W291"]
"src/ai_news_digest/application/services/rss/exceptions.py" = ["N818"]
"src/ai_news_digest/api/v1/routes/auth.py" = ["S105"]
"src/ai_news_digest/api/v1/schemas/auth.py" = ["S105"]
"tests/unit/api/v1/dependencies/test_auth.py" = ["S106"]
"tests/unit/api/v1/routes/test_admin.py" = ["S106"]
"tests/unit/api/v1/routes/test_articles.py" = ["S106"]
"tests/unit/api/v1/routes/test_categories.py" = ["S106"]
"tests/unit/api/v1/routes/test_digests.py" = ["S106"]
"tests/unit/api/v1/routes/test_sources.py" = ["S106"]
"tests/unit/api/v1/routes/test_users.py" = ["S106"]
"tests/unit/api/v1/routes/test_auth_routes.py" = ["S106", "S105"]
"tests/unit/api/v1/routes/test_admin_users.py" = ["S106"]
"tests/unit/api/v1/routes/test_deliveries.py" = ["S106"]
"tests/unit/infrastructure/auth/test_jwt.py" = ["S105"]
  "tests/unit/infrastructure/email/test_smtp_sender.py" = ["S105", "S106"]
  "tests/smoke_live.py" = ["S105"]
  "scripts/validate_production_target.py" = ["S603", "S607", "S310"]
"tests/unit/api/v1/routes/test_notification_delivery.py" = ["S106"]
"tests/unit/api/v1/routes/test_notifications.py" = ["S106"]
"tests/unit/application/services/notifications/test_digest_batching.py" = ["S106"]
"tests/unit/application/services/notifications/test_eligibility_engine.py" = ["S106"]
"tests/unit/application/services/notifications/test_notification_service.py" = ["S105", "S106"]
"tests/unit/application/use_cases/user_preference/test_user_preference_use_cases.py" = ["S106"]
"tests/unit/infrastructure/email/test_provider_factory.py" = ["S106"]
"tests/unit/workers/tasks/test_notifications.py" = ["S106"]
"tests/unit/test_migrations.py" = ["S603"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_configs = true
show_error_codes = true
namespace_packages = false
mypy_path = "src"
packages = ["ai_news_digest"]

plugins = [
    "pydantic.mypy",
    "sqlalchemy.ext.mypy.plugin",
]

[[tool.mypy.overrides]]
module = [
    "celery.*",
    "feedparser.*",
    "aiosmtplib.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "ai_news_digest.infrastructure.auth.*",
    "ai_news_digest.api.v1.dependencies.auth",
    "ai_news_digest.api.v1.routes.auth",
    "ai_news_digest.api.v1.routes.users",
    "ai_news_digest.api.v1.routes.admin",
    "ai_news_digest.api.v1.routes.user_preferences",
    "ai_news_digest.api.v1.routes.notifications",
    "ai_news_digest.api.v1.schemas.auth",
    "ai_news_digest.api.v1.schemas.notifications",
    "ai_news_digest.application.use_cases.user_preference.follow_category",
    "ai_news_digest.application.use_cases.user_preference.follow_company",
    "ai_news_digest.application.use_cases.user_preference.follow_topic",
    "ai_news_digest.application.use_cases.user_preference.get_personalized_feed",
    "ai_news_digest.application.use_cases.user_preference.get_preferences",
    "ai_news_digest.application.use_cases.user_preference.mute_category",
    "ai_news_digest.application.use_cases.user_preference.mute_company",
    "ai_news_digest.application.use_cases.user_preference.mute_topic",
    "ai_news_digest.application.use_cases.user_preference.reset_preferences",
    "ai_news_digest.application.use_cases.user_preference.unfollow_category",
    "ai_news_digest.application.use_cases.user_preference.unfollow_company",
    "ai_news_digest.application.use_cases.user_preference.unfollow_topic",
    "ai_news_digest.application.use_cases.user_preference.unmute_category",
    "ai_news_digest.application.use_cases.user_preference.unmute_company",
    "ai_news_digest.application.use_cases.user_preference.unmute_topic",
    "ai_news_digest.application.use_cases.user_preference.update_preferences",
    "ai_news_digest.application.services.notifications.*",
    "ai_news_digest.infrastructure.database.mappers.notification_mapper",
    "ai_news_digest.infrastructure.database.repositories.notification_repository",
    "ai_news_digest.workers.tasks.notifications",
    "ai_news_digest.bootstrap.container",
]
disable_error_code = ["import-untyped", "no-untyped-def", "no-any-return"]

[[tool.mypy.overrides]]
module = ["ai_news_digest.infrastructure.auth.jwt"]
disable_error_code = ["no-any-return"]

[[tool.mypy.overrides]]
module = ["ai_news_digest.workers.*"]
disable_error_code = ["untyped-decorator"]

[[tool.mypy.overrides]]
module = ["ai_news_digest.application.services.ranking.*"]
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
module = [
    "tests.unit.infrastructure.auth.test_jwt",
    "tests.unit.infrastructure.auth.test_password",
    "tests.unit.api.v1.dependencies.test_auth",
    "tests.unit.api.v1.routes.test_auth_routes",
    "tests.unit.application.use_cases.user_preference.test_personalized_feed",
    "tests.unit.application.services.notifications.test_scheduling_service",
    "tests.unit.application.services.notifications.test_rate_limiter",
    "tests.unit.application.services.notifications.test_notification_service",
    "tests.unit.application.services.notifications.test_eligibility_engine",
    "tests.unit.application.services.notifications.test_digest_batching",
    "tests.unit.application.services.notifications.test_delivery_service",
    "tests.unit.application.use_cases.story_cluster.test_story_intelligence",
    "tests.unit.application.use_cases.story_cluster.test_get_story_cluster",
    "tests.unit.infrastructure.test_redis_regression",
    "tests.conftest",
    "tests.integration.conftest",
    "tests.integration.test_migrations",
]
disable_error_code = ["import-untyped", "no-untyped-def"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

xfail_strict = true

filterwarnings = [
    "error::DeprecationWarning:ai_news_digest.*",
    "ignore::DeprecationWarning:testcontainers.*",
]

markers = [
    "unit: Unit tests with no external I/O",
    "integration: Integration tests requiring containers or databases",
    "e2e: End-to-end pipeline tests",
]

addopts = [
    "--strict-config",
    "--strict-markers",
    "-ra",
    "--cov=ai_news_digest",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-branch",
]

[tool.coverage.run]
source = ["src/ai_news_digest"]
branch = true
parallel = true

omit = [
    "*/tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false
precision = 2

exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"